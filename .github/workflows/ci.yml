name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-tests:
    name: Django checks and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: personal_platform_ci
          POSTGRES_USER: personal_platform_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personal_platform_ci -d personal_platform_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-outside-github-actions
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_ENGINE: postgresql
      DATABASE_NAME: personal_platform_ci
      DATABASE_USER: personal_platform_ci
      DATABASE_PASSWORD: ci-only-password
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
      DJANGO_HTTPS_ENABLED: "false"
      DJANGO_TRUST_PROXY_HEADER: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check tracked sensitive files
        run: python scripts/check_repository.py

      - name: Check Django configuration
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to PostgreSQL
        run: python manage.py migrate --noinput

      - name: Confirm PostgreSQL connection
        run: >-
          python manage.py shell -c
          "from django.db import connection;
          connection.ensure_connection();
          assert connection.vendor == 'postgresql', connection.vendor;
          print('Database vendor:', connection.vendor)"

      - name: Run test suite
        run: python manage.py test

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: django-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image without publishing
        run: docker build --tag personal-tech-platform:test .
