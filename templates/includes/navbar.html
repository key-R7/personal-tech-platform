{% with current_namespace=request.resolver_match.namespace current_url=request.resolver_match.url_name %}
<nav class="navbar navbar-expand-lg navbar-dark site-navbar" aria-label="主导航">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="{% url 'core:home' %}">WU.KEYI / DEV</a>
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#primaryNavigation"
            aria-controls="primaryNavigation"
            aria-expanded="false"
            aria-label="展开导航"
        >
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="primaryNavigation">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link{% if current_namespace == 'core' and current_url == 'home' %} active{% endif %}" href="{% url 'core:home' %}">首页</a></li>
                <li class="nav-item"><a class="nav-link{% if current_namespace == 'blog' %} active{% endif %}" href="{% url 'blog:article_list' %}">文章</a></li>
                <li class="nav-item"><a class="nav-link{% if current_namespace == 'projects' %} active{% endif %}" href="{% url 'projects:project_list' %}">项目</a></li>
                <li class="nav-item"><a class="nav-link{% if current_namespace == 'core' and current_url == 'about' %} active{% endif %}" href="{% url 'core:about' %}">关于我</a></li>
                <li class="nav-item"><a class="nav-link{% if current_namespace == 'admin' %} active{% endif %}" href="{% url 'admin:index' %}">管理后台</a></li>
                {% if user.is_authenticated %}
                    <li class="nav-item"><span class="navbar-text">{{ user.username }}</span></li>
                    <li class="nav-item">
                        <form method="post" action="{% url 'accounts:logout' %}">
                            {% csrf_token %}
                            <button class="btn btn-link nav-link" type="submit">退出</button>
                        </form>
                    </li>
                {% else %}
                    <li class="nav-item"><a class="nav-link{% if current_namespace == 'accounts' %} active{% endif %}" href="{% url 'accounts:login' %}">登录</a></li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
{% endwith %}
