{% load static %}
<!doctype html>
<html lang="zh-Hans" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block meta_description %}个人技术平台，记录 Python、Django 与软件工程学习实践。{% endblock %}">
    <title>{% block title %}个人技术平台{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">
    <a class="visually-hidden-focusable skip-link" href="#main-content">跳到主要内容</a>
    {% include "includes/navbar.html" %}

    {% if messages %}
        <div class="container pt-3" aria-live="polite">
            {% for message in messages %}
                <div class="alert alert-info mb-2" role="status">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

    <main id="main-content" class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    {% include "includes/footer.html" %}
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
    ></script>
</body>
</html>
